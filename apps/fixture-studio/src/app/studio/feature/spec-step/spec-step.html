<div class="source">
  <form class="source__url" novalidate (submit)="onSubmit($event)">
    <mat-form-field appearance="outline" class="source__field" hideRequiredMarker subscriptSizing="fixed">
      <mat-label>Spec URL</mat-label>
      <input [formField]="sourceForm.url" autocomplete="url" matInput placeholder="https://api.example.com/openapi.json" type="url" />
      @if (sourceForm.url().touched() && sourceForm.url().invalid()) {
        <mat-error>{{ sourceForm.url().errors()[0]?.message }}</mat-error>
      }
    </mat-form-field>
    <button [disabled]="isLoading()" class="source__submit" mat-flat-button type="submit">Load spec</button>
    @if (isLoading()) {
      <mat-progress-bar aria-label="Loading spec" class="source__progress" mode="indeterminate" />
    }
  </form>

  <span aria-hidden="true" class="source__or">or</span>

  <fs-file-drop accept=".json,application/json" heading="Drop a JSON spec" hint="or click to browse" (picked)="loadFile($event)" />
</div>

@if (fileError(); as message) {
  <p class="source__file-error" role="alert">{{ message }}</p>
}

@if (error(); as apiError) {
  <fs-api-error-notice [error]="apiError" />
}
