<span class="bar__file">{{ shownFileName() }}</span>
<span class="bar__size">{{ size() }}</span>
<span class="bar__actions">
  <button mat-button type="button" (click)="copy()">Copy</button>
  <button [disabled]="!canExport()" mat-stroked-button type="button" (click)="download()">Export</button>
</span>
@if (hashedExport(); as hashed) {
<div class="bar__naming">
  <mat-slide-toggle [checked]="isHashed()" (change)="isHashed.set($event.checked)">Name like the CLI merge</mat-slide-toggle>
  @if (isHashed()) {
  <mat-form-field appearance="outline" class="bar__url" subscriptSizing="dynamic">
    <mat-label>{{ hashed.method }} URL</mat-label>
    <input #urlField [value]="url()" matInput name="url" (input)="url.set(urlField.value)" />
  </mat-form-field>
  <mat-form-field appearance="outline" class="bar__subdirectory" subscriptSizing="dynamic">
    <mat-label>Subdirectory (optional)</mat-label>
    <input
      #subdirectoryField
      [value]="subdirectory()"
      matInput
      name="subdirectory"
      (input)="rememberSubdirectory(subdirectoryField.value)" />
  </mat-form-field>
  } @if (hashingProblem(); as problem) {
  <p class="bar__reason" role="status">{{ problem }}</p>
  }
</div>
}
