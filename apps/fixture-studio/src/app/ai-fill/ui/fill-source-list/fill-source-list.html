<details [open]="isOpen()" class="sources">
  <summary class="sources__summary">
    Where each value came from
    <span class="sources__counts">{{ counts() }}</span>
  </summary>
  <ul aria-label="Filled values by source" class="sources__list">
    @for (filled of paths(); track filled.path) {
      <li class="sources__item">
        <code class="sources__path">{{ filled.path }}</code>
        <span [attr.data-source]="filled.source" class="sources__source">{{ labels[filled.source] }}</span>
      </li>
    }
  </ul>
</details>
