  devDependencies:
    '@nx/eslint': 23.2.1
    '@nx/js': 23.2.1
    '@nx/vitest': 23.2.1
    '@playwright/test': 1.63.0
    '@types/node': 24.13.4
    ajv: 8.20.0
    eslint: 10.10.0
    jiti: 2.7.0
    lint-suite: 2.1.1
    nx: 23.2.1
    prettier: 3.9.6
    stylelint: 17.14.1
    # Nx 23.2.1 and typescript-eslint 8.x require the pre-7 compiler API.
    typescript: 6.0.3
    vite: 8.2.2
    vitest: 4.1.11

minimumReleaseAge: 2880

overrides:
