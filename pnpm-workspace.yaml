  frontend:
    '@angular/cdk': 22.1.5
    '@angular/common': 22.1.5
    '@angular/compiler': 22.1.5
    '@angular/core': 22.1.5
    '@angular/forms': 22.1.5
    '@angular/material': 22.1.5
    '@angular/platform-browser': 22.1.5
    '@codemirror/lang-javascript': 6.2.5
    '@codemirror/lang-json': 6.0.2
    '@codemirror/language': 6.12.4
    '@codemirror/merge': 6.12.2
    '@codemirror/state': 6.7.6
    '@codemirror/view': 6.43.13
    '@fontsource-variable/schibsted-grotesk': 5.3.0
    '@fontsource/fragment-mono': 5.3.0
    '@lezer/highlight': 1.2.3
    codemirror: 6.0.2
    rxjs: 7.8.2
  frontend-dev:
    '@angular/build': 22.1.7
    '@angular/cli': 22.1.7
    '@angular/compiler-cli': 22.1.5
    jsdom: 30.0.1
